schema_version: "1.0"
id: faster-rcnn-resnet50
name: Faster R-CNN ResNet50
version: 1.0.0
description: 从旧训练项目迁移的可独立部署目标检测算法
task_type: object_detection
runtime:
  framework: pytorch
  device: gpu
  min_memory_mb: 4096
input:
  media_types: [image/jpeg, image/png]
output:
  type: object_detection
parameters:
  confidence:
    type: number
    default: 0.5
    minimum: 0
    maximum: 1
    step: 0.01
    title: 置信度阈值
    description: 仅保留得分不低于该值的检测框
  nms_threshold:
    type: number
    default: 0.5
    minimum: 0
    maximum: 1
    step: 0.01
    title: NMS 重叠阈值
    description: 数值越低，重叠目标框过滤越严格
  max_detections:
    type: integer
    default: 100
    minimum: 1
    maximum: 300
    step: 1
    title: 最大检测数量
    description: 单张图片最多返回的目标框数量
  min_box_area:
    type: number
    default: 0
    minimum: 0
    maximum: 1000000
    step: 1
    title: 最小框面积
    description: 过滤面积小于该像素值的目标框，0 表示不过滤
