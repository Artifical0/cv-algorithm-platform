[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cv-faster-rcnn-algorithm"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "cv-algorithm-sdk",
  "fastapi>=0.104,<1",
  "Pillow>=11,<13",
  "PyYAML>=6,<7",
  "torch>=2.1,<3",
  "torchvision>=0.16,<1",
  "uvicorn>=0.24,<1",
]

[tool.uv.sources]
cv-algorithm-sdk = { path = "../../packages/algorithm-sdk", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/faster_rcnn_algorithm"]
