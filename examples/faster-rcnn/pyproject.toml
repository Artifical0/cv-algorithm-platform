[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cv-faster-rcnn-algorithm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "cv-algorithm-sdk",
  "fastapi>=0.116,<1",
  "Pillow>=11,<12",
  "PyYAML>=6,<7",
  "torch>=2.7,<3",
  "torchvision>=0.22,<1",
  "uvicorn[standard]>=0.35,<1",
]

[tool.uv.sources]
cv-algorithm-sdk = { path = "../../packages/algorithm-sdk", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/faster_rcnn_algorithm"]
