schema_version: "1.0"
id: yolo-detector
name: YOLO Detector
version: 1.0.0
description: 基于 Ultralytics 的独立 YOLO 目标检测算法容器
task_type: object_detection
runtime:
  framework: pytorch
  device: gpu
  min_memory_mb: 2048
input:
  media_types: [image/jpeg, image/png]
output:
  type: object_detection
parameters:
  confidence:
    type: number
    default: 0.4
    minimum: 0
    maximum: 1
    step: 0.01
    title: 置信度阈值
    description: 仅保留得分不低于该值的检测框
  iou_threshold:
    type: number
    default: 0.45
    minimum: 0
    maximum: 1
    step: 0.01
    title: NMS IoU 阈值
    description: 控制重叠检测框的合并强度
  max_detections:
    type: integer
    default: 300
    minimum: 1
    maximum: 1000
    step: 1
    title: 最大检测数量
    description: 单张图片最多返回的目标框数量
  image_size:
    type: integer
    default: 640
    minimum: 320
    maximum: 1280
    step: 32
    title: 推理输入尺寸
    description: 较大尺寸有利于小目标，但会增加显存和推理时间
  agnostic_nms:
    type: boolean
    default: false
    title: 类别无关 NMS
    description: 开启后，不同类别的重叠框也会互相抑制
